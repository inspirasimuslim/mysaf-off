# Kemas kini kebergantungan berkala (item keselamatan #1).
# Versi MAJOR diabaikan: Expo SDK 57 dan pakej React Native dipasang pada versi
# yang serasi antara satu sama lain (`npx expo install --check`). Naik major
# dibuat secara manual semasa naik taraf SDK, bukan oleh bot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      patch-dan-minor:
        update-types: ["patch", "minor"]
